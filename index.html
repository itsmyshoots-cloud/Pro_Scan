<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>Pro Scan</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      /* Hide the Manage Production top navigation tab. */
      header .top-actions > button.nav-button:nth-of-type(2) { display: none; }

      /* Daily Plan has exactly five visible shift controls after removing the
         unused Break, Daily Planned Quantity and Actual Manpower inputs. */
      .daily-production-page .daily-shift-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
      }
      @media (max-width: 1100px) {
        .daily-production-page .daily-shift-grid {
          grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
          overflow-x: auto;
        }
        .daily-production-page .daily-shift-grid > label {
          min-width: 150px;
        }
      }
      @media (max-width: 800px) {
        .daily-production-page .daily-shift-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
          overflow-x: visible;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Daily Plan UI refinement. React owns the underlying state; this only
      // removes the three inputs requested and keeps hourly slots synchronized
      // with Target / hour while respecting the monthly pool quantity.
      (() => {
        const getLabelText = label => (label?.firstChild?.textContent || '').trim();
        const setNativeValue = (input, value) => {
          const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value')?.set;
          if (setter) setter.call(input, String(value));
          else input.value = String(value);
          input.dispatchEvent(new Event('input', { bubbles: true }));
        };
        const patchDailyPlan = () => {
          const page = document.querySelector('.daily-production-page');
          if (!page) return;

          const labels = [...page.querySelectorAll('.daily-shift-grid > label')];
          for (const label of labels) {
            if (['Break minutes', 'Daily planned quantity', 'Actual manpower'].includes(getLabelText(label))) {
              label.style.display = 'none';
              label.setAttribute('aria-hidden', 'true');
            }
          }

          const summaryLabels = [...page.querySelectorAll('.daily-capacity-summary span')];
          const dailyPlannedLabel = summaryLabels.find(el => el.textContent.trim() === 'Daily planned');
          if (dailyPlannedLabel) dailyPlannedLabel.textContent = 'Monthly planned';

          const rateLabel = labels.find(label => getLabelText(label) === 'Target / hour');
          const plannedLabel = labels.find(label => getLabelText(label) === 'Daily planned quantity');
          const rateInput = rateLabel?.querySelector('input');
          const plannedInput = plannedLabel?.querySelector('input');
          const hourlyInputs = [...page.querySelectorAll('.hourly-target-grid input')];
          if (!rateInput || !plannedInput || !hourlyInputs.length) return;

          const rate = Math.max(0, Math.floor(Number(rateInput.value) || 0));
          const total = Math.max(0, Math.floor(Number(plannedInput.value) || 0));
          if (!Number.isFinite(rate) || !Number.isFinite(total)) return;

          let remaining = total;
          hourlyInputs.forEach(input => {
            input.readOnly = true;
            input.setAttribute('aria-readonly', 'true');
            const next = rate > 0 ? Math.min(rate, Math.max(0, remaining)) : 0;
            if (Number(input.value) !== next) setNativeValue(input, next);
            remaining -= next;
          });
        };

        const root = document.getElementById('root');
        if (!root) return;
        const observer = new MutationObserver(() => patchDailyPlan());
        observer.observe(root, { childList: true, subtree: true });
        document.addEventListener('input', event => {
          if (event.target?.closest?.('.daily-production-page')) setTimeout(patchDailyPlan, 0);
        }, true);
        document.addEventListener('change', event => {
          if (event.target?.closest?.('.daily-production-page')) setTimeout(patchDailyPlan, 0);
        }, true);
        setInterval(patchDailyPlan, 1000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
