name: Apply live carry-forward UI

on:
  push:
    branches: [feat/live-carry-forward-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch App.jsx
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text(encoding='utf-8')
          marker = " const fetchAllRows=async queryBuilder=>{"
          if 'id=\"proscan-carry-forward-live\"' in s:
              raise SystemExit('Carry-forward UI already patched')
          if marker not in s:
              raise SystemExit('Insertion marker not found')
          block = r'''\n useEffect(()=>{\n  if(typeof document==='undefined'||document.getElementById('proscan-carry-forward-live'))return;\n  const root=document.createElement('div');root.id='proscan-carry-forward-live';\n  const style=document.createElement('style');style.textContent=`#proscan-carry-forward-live .cf-button{position:fixed;right:22px;bottom:22px;z-index:9998;border:0;border-radius:14px;padding:12px 16px;background:#111827;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.18)}#proscan-carry-forward-live .cf-modal{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:20px}#proscan-carry-forward-live .cf-panel{width:min(1050px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.28)}#proscan-carry-forward-live .cf-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}#proscan-carry-forward-live .cf-title{font-size:22px;font-weight:800;color:#111827}#proscan-carry-forward-live .cf-sub{font-size:13px;color:#64748b;margin-top:5px}.cf-actions{display:flex;gap:8px}.cf-actions button{border:0;border-radius:10px;padding:8px 12px;background:#e2e8f0;font-weight:700;cursor:pointer}.cf-card{border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin:12px 0;background:#f8fafc}.cf-card-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.cf-name{font-weight:800;color:#111827}.cf-meta{font-size:13px;color:#64748b;margin-top:4px}.cf-pill{padding:6px 10px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:12px;font-weight:800;white-space:nowrap}.cf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}.cf-item{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px}.cf-label{font-size:10px;color:#64748b;text-transform:uppercase;font-weight:800;letter-spacing:.04em}.cf-value{font-size:14px;font-weight:750;color:#111827;margin-top:4px}.cf-empty{text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:14px;padding:32px}@media(max-width:720px){#proscan-carry-forward-live .cf-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}`;\n  document.head.appendChild(style);\n  const btn=document.createElement('button');btn.className='cf-button';btn.textContent='↪ Carry Forward';\n  const modal=document.createElement('div');modal.className='cf-modal';const panel=document.createElement('div');panel.className='cf-panel';modal.appendChild(panel);root.append(btn,modal);document.body.appendChild(root);\n  const esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));\n  const qty=v=>Number(v||0).toLocaleString('en-IN');\n  const clock=v=>{if(!v)return '—';const parts=String(v).slice(0,5).split(':').map(Number);if(!Number.isFinite(parts[0]))return String(v);return `${String(parts[0]%12||12).padStart(2,'0')}:${String(parts[1]||0).padStart(2,'0')} ${parts[0]>=12?'PM':'AM'}`};\n  const shift=p=>{const rows=Array.isArray(p?.hourly_targets)?p.hourly_targets:[];const hours=rows.map(r=>String(r.hour||'').slice(0,5)).filter(Boolean).sort();if(!hours.length)return '—';const a=hours[0].split(':').map(Number),z=hours[hours.length-1].split(':').map(Number),end=z[0]*60+z[1]+60;return `${clock(hours[0])} – ${clock(String(Math.floor((end%(24*60))/60)).padStart(2,'0')+':'+String(end%60).padStart(2,'0'))}`};\n  const close=()=>modal.style.display='none';\n  const render=async()=>{\n   panel.innerHTML='<div class="cf-head"><div><div class="cf-title">Carry Forward Production</div><div class="cf-sub">Pending production moved from an earlier plan into a later shift.</div></div><div class="cf-actions"><button class="cf-refresh">↻ Refresh</button><button class="cf-close">Close</button></div></div><div class="cf-empty">Loading…</div>';\n   panel.querySelector('.cf-close').onclick=close;panel.querySelector('.cf-refresh').onclick=render;modal.style.display='flex';\n   const r=await supabase.from('production_plans').select('*').order('production_date',{ascending:false}).order('created_at',{ascending:false}).limit(500);\n   if(r.error){panel.querySelector('.cf-empty').textContent='Unable to load carry-forward plans: '+r.error.message;return;}\n   const all=r.data||[],map=new Map(all.map(p=>[p.id,p])),items=all.filter(p=>p.carry_forward_from_plan_id||Number(p.carry_forward_qty||0)>0||p.carry_forward_plan_id);\n   if(!items.length){panel.querySelector('.cf-empty').innerHTML='<b>No carry-forward plans yet</b><br>When a plan has pending quantity and it is carried into another shift, the record will appear here.';return;}\n   panel.innerHTML='<div class="cf-head"><div><div class="cf-title">Carry Forward Production</div><div class="cf-sub">'+items.length+' carry-forward record'+(items.length===1?'':'s')+'</div></div><div class="cf-actions"><button class="cf-refresh">↻ Refresh</button><button class="cf-close">Close</button></div></div>';\n   for(const p of items){const prev=p.carry_forward_from_plan_id?map.get(p.carry_forward_from_plan_id):null;const carry=Number(p.carry_forward_qty||0),cap=Number(p.shift_planned_qty??p.planned_qty??0);const card=document.createElement('div');card.className='cf-card';card.innerHTML='<div class="cf-card-top"><div><div class="cf-name">'+esc(p.production_date||'—')+' · '+esc(p.production_line||'—')+' · '+esc(p.shift_name||'—')+'</div><div class="cf-meta">'+esc(p.brand||'')+' · '+esc(p.product_name||'')+' · '+esc(p.model||'')+'</div></div><span class="cf-pill">'+qty(carry)+' units carried</span></div><div class="cf-grid"><div class="cf-item"><div class="cf-label">Previous plan</div><div class="cf-value">'+esc(prev?.production_date||'—')+'</div></div><div class="cf-item"><div class="cf-label">Previous shift</div><div class="cf-value">'+esc(prev?.shift_name||'—')+' · '+esc(prev?shift(prev):'—')+'</div></div><div class="cf-item"><div class="cf-label">Carry-forward</div><div class="cf-value">'+qty(carry)+' units</div></div><div class="cf-item"><div class="cf-label">Current capacity</div><div class="cf-value">'+qty(cap)+' units</div></div><div class="cf-item"><div class="cf-label">Current shift</div><div class="cf-value">'+esc(p.shift_name||'—')+' · '+esc(shift(p))+'</div></div><div class="cf-item"><div class="cf-label">Manpower</div><div class="cf-value">'+qty(p.manpower_count)+' people</div></div><div class="cf-item"><div class="cf-label">Source status</div><div class="cf-value">'+esc(prev?.status||'—')+'</div></div><div class="cf-item"><div class="cf-label">Current status</div><div class="cf-value">'+esc(p.status||'—')+'</div></div></div>';panel.appendChild(card);}\n   panel.querySelector('.cf-close').onclick=close;panel.querySelector('.cf-refresh').onclick=render;\n  };\n  btn.onclick=render;modal.onclick=e=>{if(e.target===modal)close();};\n  return()=>{root.remove();style.remove();};\n },[]);\n'''
          p.write_text(s.replace(marker, block + marker, 1), encoding='utf-8')

      - name: Build and commit
        run: |
          npm install
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Add live carry-forward production view" || exit 0
          git push origin HEAD
