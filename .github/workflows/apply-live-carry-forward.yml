name: Apply live carry-forward UI

on:
  push:
    branches: [feat/live-carry-forward-ui]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-carry-forward-ui
          fetch-depth: 0
      - name: Apply source patch
        run: python scripts/apply_carry_forward.py
      - name: Build
        run: |
          npm install
          npm run build
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Add live carry-forward production view"
          git push origin HEAD:feat/live-carry-forward-ui
