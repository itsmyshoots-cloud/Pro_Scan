name: Apply V1.1 production planning UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-v11-ui:
    if: ${{ !contains(github.event.head_commit.message, '[v1.1-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update production planning UI and rollover
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()
          marker = '// V1.1 SHIFT PLANNING'
          if marker in s:
              raise SystemExit(0)

          s = s.replace("const [dashboardHourlyPlanId,setDashboardHourlyPlanId]=useState(''); const [shiftStart,setShiftStart]=useState('09:00'); const [shiftEnd,setShiftEnd]=useState('18:00'); const [hourlyTargets,setHourlyTargets]=useState(()=>rebalanceHourlyTargets(createHourlyTargets('09:00','18:00'),500));", "const [dashboardHourlyPlanId,setDashboardHourlyPlanId]=useState(''); const [shiftName,setShiftName]=useState('Shift A'); const [shiftStart,setShiftStart]=useState('09:00'); const [shiftEnd,setShiftEnd]=useState('18:00'); const [shiftPlannedQty,setShiftPlannedQty]=useState(500); const [manpowerCount,setManpowerCount]=useState(0); const [hourlyTargets,setHourlyTargets]=useState(()=>distributeHourlyTargetsEvenly(createHourlyTargets('09:00','18:00'),500));")

          old_load = "const load=async()=>{const {data,error}=await supabase.from('production_plans').select('*').order('production_date',{ascending:false}).limit(100);if(error){setMessage(error.message);return;}if(data)setPlans(data)};"
          new_load = "const load=async()=>{try{await supabase.rpc('ensure_production_carry_forward',{p_target_date:localDateKey(new Date())});}catch{} const {data,error}=await supabase.from('production_plans').select('*').order('production_date',{ascending:false}).limit(200);if(error){setMessage(error.message);return;}if(data)setPlans(data)};"
          s = s.replace(old_load,new_load)

          s = s.replace("setShiftStart('09:00');setShiftEnd('18:00');setHourlyTargets(rebalanceHourlyTargets(createHourlyTargets('09:00','18:00'),500));", "setShiftName('Shift A');setShiftStart('09:00');setShiftEnd('18:00');setShiftPlannedQty(500);setManpowerCount(0);setHourlyTargets(distributeHourlyTargetsEvenly(createHourlyTargets('09:00','18:00'),500));")

          s = s.replace("setShiftStart(startValue);setShiftEnd(endValue);setHourlyTargets(rebalanceHourlyTargets(schedule,qty));", "setShiftName(plan.shift_name||'Shift A');setShiftStart(plan.shift_start||startValue);setShiftEnd(plan.shift_end||endValue);setShiftPlannedQty(Number(plan.shift_planned_qty ?? qty));setManpowerCount(Number(plan.manpower_count||0));setHourlyTargets(Array.isArray(plan.hourly_targets)&&plan.hourly_targets.length?schedule:distributeHourlyTargetsEvenly(createHourlyTargets(startValue,endValue),Number(plan.shift_planned_qty??qty)));" )

          s = s.replace("setForm({...form,planned_qty:value});setHourlyTargets(previous=>distributeHourlyTargetsEvenly(previous,Number(value||0)));", "setForm({...form,planned_qty:value});")

          old_shift = "<div className='shift-time-fields'><label>Shift start<input type='time' value={shiftStart} onChange={e=>{const next=e.target.value;setShiftStart(next);setHourlyTargets(previous=>distributeHourlyTargetsEvenly(createHourlyTargets(next,shiftEnd,previous),Number(form.planned_qty||0)));}}/></label><label>Shift end<input type='time' value={shiftEnd} onChange={e=>{const next=e.target.value;setShiftEnd(next);setHourlyTargets(previous=>distributeHourlyTargetsEvenly(createHourlyTargets(shiftStart,next,previous),Number(form.planned_qty||0)));}}/></label></div>"
          new_shift = "<div className='shift-time-fields'><label>Shift name<input value={shiftName} onChange={e=>setShiftName(e.target.value)} placeholder='Shift A'/></label><label>Shift start<input type='time' value={shiftStart} onChange={e=>{const next=e.target.value;setShiftStart(next);setHourlyTargets(previous=>distributeHourlyTargetsEvenly(createHourlyTargets(next,shiftEnd),Number(shiftPlannedQty||0)));}}/></label><label>Shift end<input type='time' value={shiftEnd} onChange={e=>{const next=e.target.value;setShiftEnd(next);setHourlyTargets(previous=>distributeHourlyTargetsEvenly(createHourlyTargets(shiftStart,next),Number(shiftPlannedQty||0)));}}/></label><label>Shift planned quantity<input type='number' min='0' value={shiftPlannedQty} onChange={e=>{const value=e.target.value;setShiftPlannedQty(value);setHourlyTargets(previous=>distributeHourlyTargetsEvenly(previous,Number(value||0)));}}/></label><label>Manpower used<input type='number' min='0' step='1' value={manpowerCount} onChange={e=>setManpowerCount(Math.max(0,Math.floor(Number(e.target.value)||0)))}/></label></div>"
          s = s.replace(old_shift,new_shift)

          s = s.replace("if(hourlyTargetTotal!==qty)return setMessage('Hourly target total ('+hourlyTargetTotal.toLocaleString()+') must equal total planned quantity ('+qty.toLocaleString()+').');", "const shiftQty=Math.max(0,Math.floor(Number(shiftPlannedQty)||0)); if(shiftQty>qty)return setMessage('Shift planned quantity cannot exceed total planned quantity.'); if(hourlyTargetTotal!==shiftQty)return setMessage('Hourly target total ('+hourlyTargetTotal.toLocaleString()+') must equal shift planned quantity ('+shiftQty.toLocaleString()+').');")

          s = s.replace("const {data:plan,error:planError}=await supabase.from('production_plans').insert({...form,brand:form.brand.trim()||'Unspecified',planned_qty:qty,hourly_targets:hourlyPayload,status:'draft'}).select().single();", "const {data:plan,error:planError}=await supabase.from('production_plans').insert({...form,brand:form.brand.trim()||'Unspecified',planned_qty:qty,hourly_targets:hourlyPayload,status:'draft',shift_name:shiftName.trim()||'Shift A',shift_start:shiftStart,shift_end:shiftEnd,shift_planned_qty:shiftQty,manpower_count:manpowerCount}).select().single();")

          s = s.replace("setReportDownloadPlanId('');", "setReportDownloadPlanId('');", 1)

          # Add manpower/shift columns to the existing management table.
          s = s.replace("<th>Line</th><th>Progress</th><th>Status</th>", "<th>Line / Shift</th><th>Shift Qty</th><th>Manpower</th><th>Progress</th><th>Status</th>")
          s = s.replace("<td>{plan.production_line}</td><td><div className='manage-progress'>", "<td>{plan.production_line}<br/><small>{plan.shift_name||'Shift A'} · {plan.shift_start||'—'}–{plan.shift_end||'—'}</small></td><td>{Number(plan.shift_planned_qty??plan.planned_qty??0).toLocaleString()}</td><td>{Number(plan.manpower_count||0).toLocaleString()}</td><td><div className='manage-progress'>")

          # Report description and filters become explicit about plan/date/shift/manpower.
          s = s.replace("<p>Filter production plans and download the complete serial and scan-event history for any matching plan.</p>", "<p>Filter by production plan or production date and download planned, actual, pending, shift and manpower details.</p>")
          s = s.replace("<label>From date", "<label>Production plan<select value={reportDownloadPlanId} onChange={e=>setReportDownloadPlanId(e.target.value)}><option value=''>All plans</option>{filteredReportPlans.map(plan=><option key={plan.id} value={plan.id}>{plan.production_date} · {plan.production_line} · {plan.model}</option>)}</select></label><label>From date", 1)

          # Show a concise carry-forward banner on management rows.
          s = s.replace("<small>{plan.brand||'—'} · {plan.model} · {target.toLocaleString()} units</small>", "<small>{plan.brand||'—'} · {plan.model} · Total {target.toLocaleString()} · Shift {Number(plan.shift_planned_qty??target).toLocaleString()} · Manpower {Number(plan.manpower_count||0).toLocaleString()}</small>{plan.carry_forward_from_plan_id&&<small className='carry-forward-note'>↳ Carry-forward from previous production plan · {Number(plan.carry_forward_qty||0).toLocaleString()} pending</small>}")

          s = marker + "\n" + s
          p.write_text(s)
          print('V1.1 UI changes applied')
      - name: Commit V1.1 UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Add V1.1 shift planning and manpower UI [v1.1-ui]"
          git push
