name: Add live carry-forward UI
on:
  push:
    branches: [feat/live-carry-forward-2]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch App.jsx
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.jsx'); s=p.read_text(encoding='utf-8')
          if 'proscan-carry-forward-root' in s:
              raise SystemExit('already patched')
          marker=" const fetchAllRows=async queryBuilder=>{"
          if marker not in s: raise SystemExit('insertion marker not found')
          block=r'''\n useEffect(()=>{\n  if(typeof document==='undefined'||document.getElementById('proscan-carry-forward-root'))return;\n  const root=document.createElement('div');root.id='proscan-carry-forward-root';\n  const style=document.createElement('style');style.textContent=`#proscan-carry-forward-root .cfb{position:fixed;right:22px;bottom:22px;z-index:9998;border:0;border-radius:14px;padding:12px 16px;background:#111827;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.18)}#proscan-carry-forward-root .cfm{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.42);display:none;align-items:center;justify-content:center;padding:20px}#proscan-carry-forward-root .cfp{width:min(980px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.25)}#proscan-carry-forward-root .cfh{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.cft{font-size:22px;font-weight:800;color:#111827}.cfs{font-size:13px;color:#64748b;margin-top:4px}.cfclose,.cfref{border:0;border-radius:10px;padding:8px 12px;background:#e2e8f0;font-weight:700;cursor:pointer}.cfc{border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin:12px 0;background:#f8fafc}.cfg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.cfi{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px}.cfl{font-size:11px;color:#64748b;text-transform:uppercase;font-weight:700}.cfv{font-size:15px;font-weight:750;color:#111827;margin-top:3px}.cfb2{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:12px;font-weight:800}.cfe{text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:14px;padding:28px}@media(max-width:720px){#proscan-carry-forward-root .cfg{grid-template-columns:repeat(2,minmax(0,1fr))}}`;\n  document.head.appendChild(style);const btn=document.createElement('button');btn.className='cfb';btn.textContent='↪ Carry Forward';const modal=document.createElement('div');modal.className='cfm';const panel=document.createElement('div');panel.className='cfp';modal.appendChild(panel);root.append(btn,modal);document.body.appendChild(root);\n  const esc=v=>String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const qty=v=>Number(v||0).toLocaleString('en-IN');\n  const clock=v=>{if(!v)return '—';const [h,m]=String(v).slice(0,5).split(':').map(Number);return Number.isFinite(h)?`${String(h%12||12).padStart(2,'0')}:${String(m||0).padStart(2,'0')} ${h>=12?'PM':'AM'}`:String(v)};\n  const shift=p=>{const a=(Array.isArray(p?.hourly_targets)?p.hourly_targets:[]).map(r=>String(r.hour||'').slice(0,5)).filter(Boolean).sort();if(!a.length)return '—';const [h,m]=a[a.length-1].split(':').map(Number),x=h*60+m+60;return `${clock(a[0])} – ${clock(String(Math.floor((x%(24*60))/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0'))}`};\n  const close=()=>modal.style.display='none';\n  const render=async()=>{panel.innerHTML='<div class="cfh"><div><div class="cft">Carry Forward Production</div><div class="cfs">Pending production automatically moved into a later plan.</div></div><div><button class="cfref">Refresh</button> <button class="cfclose">Close</button></div></div><div class="cfe">Loading…</div>';panel.querySelector('.cfclose').onclick=close;panel.querySelector('.cfref').onclick=render;modal.style.display='flex';const r=await supabase.from('production_plans').select('*').order('production_date',{ascending:false}).order('created_at',{ascending:false}).limit(200);if(r.error){panel.querySelector('.cfe').textContent='Unable to load: '+r.error.message;return}const all=r.data||[],map=new Map(all.map(p=>[p.id,p])),items=all.filter(p=>p.carry_forward_from_plan_id||Number(p.carry_forward_qty||0)>0||p.carry_forward_plan_id);if(!items.length){panel.querySelector('.cfe').innerHTML='<b>No carry-forward plans</b><br>Pending production will appear here when a plan carries work into another plan.';return}panel.innerHTML='<div class="cfh"><div><div class="cft">Carry Forward Production</div><div class="cfs">'+items.length+' record'+(items.length===1?'':'s')+'</div></div><div><button class="cfref">Refresh</button> <button class="cfclose">Close</button></div></div>';for(const p of items){const prev=p.carry_forward_from_plan_id?map.get(p.carry_forward_from_plan_id):null;const carry=Number(p.carry_forward_qty||0),cap=Number(p.shift_planned_qty??p.planned_qty??0),card=document.createElement('div');card.className='cfc';card.innerHTML='<div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><b>'+esc(p.production_date||'—')+' · '+esc(p.production_line||'—')+' · '+esc(p.shift_name||'—')+'</b><div class="cfs">'+esc(p.brand||'')+' '+esc(p.product_name||'')+' '+esc(p.model||'')+'</div></div><span class="cfb2">'+qty(carry)+' units carried</span></div><div class="cfg"><div class="cfi"><div class="cfl">Previous plan</div><div class="cfv">'+esc(prev?.production_date||'—')+'</div></div><div class="cfi"><div class="cfl">Previous shift</div><div class="cfv">'+esc(prev?.shift_name||'—')+' · '+esc(prev?shift(prev):'—')+'</div></div><div class="cfi"><div class="cfl">Carry-forward</div><div class="cfv">'+qty(carry)+' units</div></div><div class="cfi"><div class="cfl">Current capacity</div><div class="cfv">'+qty(cap)+' units</div></div><div class="cfi"><div class="cfl">Current shift</div><div class="cfv">'+esc(p.shift_name||'—')+' · '+esc(shift(p))+'</div></div><div class="cfi"><div class="cfl">Manpower</div><div class="cfv">'+qty(p.manpower_count)+' people</div></div><div class="cfi"><div class="cfl">Source status</div><div class="cfv">'+esc(prev?.status||'—')+'</div></div><div class="cfi"><div class="cfl">Current status</div><div class="cfv">'+esc(p.status||'—')+'</div></div></div>';panel.appendChild(card)}panel.querySelector('.cfclose').onclick=close;panel.querySelector('.cfref').onclick=render};btn.onclick=render;modal.onclick=e=>{if(e.target===modal)close()};return()=>{root.remove();style.remove()};\n },[]);\n'''
          p.write_text(s.replace(marker,block+marker,1),encoding='utf-8')
      - name: Build and commit
        run: |
          npm install
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git commit -m "Add live carry-forward production view" || exit 0
          git push origin HEAD
